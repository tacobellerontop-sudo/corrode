name: Windows build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build solace.exe
    runs-on: windows-latest
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4

      # rust-toolchain.toml pins the compiler; rustup installs it on first use.
      - name: Install Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: Install NASM
        run: choco install nasm --no-progress -y

      - name: Add NASM to PATH
        run: echo "C:\Program Files\NASM" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --release --locked -p solace

      - name: Build offline showcase
        run: cargo build --release --locked -p solace --features demo --target-dir target/showcase

      - name: Test interface crate
        run: cargo test --locked -p solace-ui

      - name: Stage artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/solace.exe dist/solace.exe
          Copy-Item target/showcase/release/solace.exe dist/solace-showcase.exe
          Set-Content dist/README.txt @"
          solace-<version>-setup.exe  Installs Solace for you (no admin rights), with a Start Menu entry and an uninstaller.
          solace.exe                  Portable: run it from any folder and sign in with your Discord account.
          solace-showcase.exe         Run with --demo for the offline showcase (no account, no network).
          Requires the Microsoft Edge WebView2 Runtime (preinstalled on Windows 11).
          "@

      # The installer carries the app, its notification-shortcut helper and the licenses.
      - name: Stage installer payload
        shell: pwsh
        run: |
          $payload = 'payload'
          New-Item -ItemType Directory -Force $payload, "$payload/licenses" | Out-Null
          Copy-Item target/release/solace.exe $payload/
          Copy-Item packaging/windows/install-notifications.ps1, packaging/windows/setup.ps1, README.md $payload/
          foreach ($file in 'LICENSE-MIT', 'LICENSE-APACHE', 'THIRD_PARTY_NOTICES.md') {
            if (Test-Path $file) { Copy-Item $file $payload/ }
          }
          Copy-Item assets/licenses/* "$payload/licenses" -Recurse
          Copy-Item assets/fonts/*-OFL.*, assets/fonts/*-LICENSE.* "$payload/licenses"
          Copy-Item assets/twemoji/LICENSE-GRAPHICS "$payload/licenses/Twemoji-CC-BY-4.0.txt"
          Copy-Item assets/twemoji/LICENSE-UNICODE "$payload/licenses/Unicode-LICENSE.txt"
          Copy-Item assets/sounds/README.md "$payload/licenses/notification-sounds.md"

      - name: Install NSIS
        shell: pwsh
        run: |
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue) -and
              -not (Test-Path 'C:\Program Files (x86)\NSIS\makensis.exe')) {
            choco install nsis --no-progress -y
          }

      - name: Build installer
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"' |
            Select-Object -First 1).Matches[0].Groups[1].Value
          if ($env:GITHUB_REF_TYPE -eq 'tag') { $version = $env:GITHUB_REF_NAME.TrimStart('v') }
          $makensis = (Get-Command makensis -ErrorAction SilentlyContinue).Source
          if (-not $makensis) { $makensis = 'C:\Program Files (x86)\NSIS\makensis.exe' }
          New-Item -ItemType Directory -Force dist-installer | Out-Null
          & $makensis -NOCD "-DVERSION=$version" -DDIST_DIR=payload -DOUTPUT_DIR=dist-installer packaging/windows/installer.nsi
          if ($LASTEXITCODE -ne 0) { throw "makensis failed with exit code $LASTEXITCODE" }
          Copy-Item dist-installer/*.exe dist/

      - uses: actions/upload-artifact@v4
        with:
          name: solace-windows-x64
          path: dist/
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: solace-windows-installer
          path: dist-installer/*.exe
          if-no-files-found: error

  # Pushing a v* tag publishes the installer and portable build as a GitHub release.
  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: solace-windows-x64
          path: dist

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/solace-*-setup.exe
            dist/solace.exe
          generate_release_notes: true
