[package]
name = "platform"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
client-core.workspace = true
model.workspace = true
serde_json.workspace = true
tokio.workspace = true
notify-rust = "=4.18.0"
winit.workspace = true
global-hotkey.workspace = true
keyring.workspace = true
url.workspace = true
zeroize.workspace = true
getrandom.workspace = true
rfd = { version = "=0.17.2", default-features = false }

[lints.rust]
# Native integrations permit unsafe only in their audited OS boundaries.
unsafe_code = "deny"

[target.'cfg(target_os = "windows")'.dependencies]
tauri-winrt-notification = "=0.7.3"
windows-core = "=0.61.2"
windows = { version = "=0.61.3", features = ["UI_Notifications", "Win32_Security_Authorization", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi_Common", "Win32_Media_MediaFoundation", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant"] }
wry.workspace = true
